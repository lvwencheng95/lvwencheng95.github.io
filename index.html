<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跑步抽奖轮盘</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      text-align: center;
    }
    #wheel {
      position: relative;
      width: 80vmin;
      height: 80vmin;
      max-width: 400px;
      max-height: 400px;
      margin-bottom: 30px;
    }
    #canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 
        0 0 0 10px rgba(255,255,255,0.1),
        0 20px 60px rgba(0,0,0,0.4),
        inset 0 0 50px rgba(255,255,255,0.1);
      display: block;
    }
    #pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 35px solid #ff4757;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      z-index: 20;
    }
    #spinBtn {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255,107,107,0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #spinBtn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 15px 40px rgba(255,107,107,0.5);
    }
    #spinBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #result {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      min-height: 40px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.5s ease;
    }
    #result.show {
      opacity: 1;
      transform: scale(1);
    }
    .dist {
      color: #ff6b6b;
      font-size: 1.4em;
      display: block;
    }
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 24px;
      }
      #wheel {
        width: 90vmin;
        height: 90vmin;
      }
    }
  </style>
</head>
<body>
  <h1>🏃‍♂️ 跑步距离抽奖轮盘</h1>
  <div id="wheel">
    <canvas id="canvas"></canvas>
    <div id="pointer"></div>
  </div>
  <button id="spinBtn">🎲 开始抽奖！</button>
  <div id="result"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultEl = document.getElementById('result');
    const wheelEl = document.getElementById('wheel');

    let isSpinning = false;
    let rotation = 0;

    const TAU = Math.PI * 2;
    const pointerAngle = -Math.PI / 2; // Top position
    const distances = [
      { label: '3.14', dist: '3.14公里', color: '#FFE4E1' },
      { label: '5.20', dist: '5.20公里', color: '#E8F7F0' },
      { label: '4.40', dist: '4.40公里', color: '#FFF8DC' },
      { label: '5.00', dist: '5.00公里', color: '#F0E8FF' },
      { label: '4.13', dist: '4.13公里', color: '#FFF0F5' }
    ];
    const numSegments = distances.length;
    const segmentAngle = TAU / numSegments;

    function resizeCanvas() {
      const rect = wheelEl.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      drawWheel();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = Math.min(centerX, centerY) * 0.9;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw segments
      for (let i = 0; i < numSegments; i++) {
        const startAngle = rotation + i * segmentAngle;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, startAngle + segmentAngle);
        ctx.closePath();
        ctx.fillStyle = distances[i].color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Segment label
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + segmentAngle / 2);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const fontSize = Math.min(radius / 14, 32);
        ctx.font = `bold ${fontSize}px system-ui, Arial`;
        ctx.fillStyle = 'white';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillText(distances[i].label, radius * 0.65, 0);
        ctx.restore();
      }

      // Center circle
      const centerRadius = radius * 0.08;
      ctx.beginPath();
      ctx.arc(centerX, centerY, centerRadius, 0, TAU);
      ctx.fillStyle = '#333';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      resultEl.textContent = '🎰 转转转...';
      resultEl.classList.remove('show');

      const randomIndex = Math.floor(Math.random() * numSegments);
      const targetRotation = (pointerAngle - (randomIndex * segmentAngle + segmentAngle / 2) + TAU) % TAU;
      const spins = 5 + Math.random() * 3;
      const deltaRotation = (rotation - targetRotation + TAU) % TAU;
      const spinAmount = TAU * spins + deltaRotation;
      const duration = 3500 + Math.random() * 1000;
      const startTime = performance.now();
      const startRotation = rotation;

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3); // Cubic ease-out
        rotation = startRotation - spinAmount * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          rotation = targetRotation;
          drawWheel();

          // Show result
          resultEl.innerHTML = `🎉 抽中了！<br><span class="dist">${distances[randomIndex].dist}</span><br>💪 今天就跑这个距离吧！`;
          resultEl.classList.add('show');

          setTimeout(() => {
            isSpinning = false;
            spinBtn.disabled = false;
          }, 4000);
        }
      }

      requestAnimationFrame(animate);
    }

    spinBtn.addEventListener('click', spin);
    drawWheel();
  </script>
</body>
</html>
